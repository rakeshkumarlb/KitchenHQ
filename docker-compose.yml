services:
  dbmcp:
    build:
      context: ./dbmcp
    container_name: kitchenhq-db-mcp
    environment:
      KITCHEN_DB_PATH: /data/kitchen.db
      MCP_HOST: 0.0.0.0
      MCP_PORT: 18000
      MCP_TRANSPORT: streamable-http
      KITCHENHQ_API_KEY: ${KITCHENHQ_API_KEY:?KITCHENHQ_API_KEY must be set}
    ports:
      - "18000:18000"
    volumes:
      - "${KITCHEN_DB_HOST_PATH:-./data}:/data"

  agent-api:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: kitchenhq-agent-api
    depends_on:
      - dbmcp
    env_file:
      - path: ./agents/.env
        required: false
    environment:
      MCP_URL: http://dbmcp:18000/mcp
      MCP_TRANSPORT: streamable_http
      DB_API_URL: http://dbmcp:18000
      TZ: ${KITCHEN_TIMEZONE:-Asia/Kolkata}
      KITCHENHQ_API_KEY: ${KITCHENHQ_API_KEY:?KITCHENHQ_API_KEY must be set}
      # Optional: set SMTP_HOST (and creds) so the agents can email the profile address
      # via the send_*_email tools (prep plan / weekly menu / shopping list). No
      # automatic send. Unset = those tools report {"sent": false}, jobs unaffected.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
    ports:
      - "8090:8090"

  chatui:
    build:
      context: ./chatui
    container_name: kitchenhq-chatui
    depends_on:
      - dbmcp
      - agent-api
    environment:
      DB_API_URL: http://dbmcp:18000
      AGENT_API_URL: http://agent-api:8090
      KITCHENHQ_API_KEY: ${KITCHENHQ_API_KEY:?KITCHENHQ_API_KEY must be set}
    ports:
      - "8080:8080"
